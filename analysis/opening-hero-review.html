<script>const v=document.querySelector('#video');let started=null;const log=[];const output=()=>{const s={source:v.getAttribute('src'),time:v.currentTime,duration:v.duration,rate:v.playbackRate,ended:v.ended,paused:v.paused,muted:v.muted,error:v.error?.code??null,wallSeconds:started?(performance.now()-started)/1000:null};document.querySelector('#state').textContent=JSON.stringify(s,null,2);log.push(s);window.playbackRecord=log;};document.querySelector('#play').onclick=()=>{v.currentTime=0;v.playbackRate=1;started=performance.now();v.play();};document.querySelector('#pause').onclick=()=>v.pause();document.querySelector('#source').onchange=e=>{v.src=e.target.value;v.load();};v.ontimeupdate=output;v.onended=output;v.onerror=output;</script>
